<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มุยมุย – ผู้ช่วยจัดการชีวิตนักศึกษา</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFDBDA">
<link rel="apple-touch-icon" href="muimui-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFDBDA;--surface:#FFF7F6;--card:#FFFFFF;--ink:#604D53;--sub:#604D53;--line:#DB7F8E;--pri:#DB7F8E;--pri2:#FFF0F0;--ok:#9DA3A4;--warn:#DB7F8E;--bad:#604D53;--h0:#FFF7F6;--h1:#D5C5C8;--h2:#FFDBDA;--h3:#DB7F8E;--h4:#9DA3A4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#30272B;--card:#49383D;--ink:#FFF3F2;--sub:#E3CDD0;--line:#705B61;--pri:#DB7F8E;--pri2:#604D53;--ok:#9DA3A4;--warn:#DB7F8E;--bad:#D5C5C8;--h0:#49383D;--h1:#604D53;--h2:#806D72;--h3:#DB7F8E;--h4:#9DA3A4}}
:root[data-theme="dark"]{--bg:#30272B;--card:#49383D;--ink:#FFF3F2;--sub:#E3CDD0;--line:#705B61;--pri:#DB7F8E;--pri2:#604D53;--ok:#9DA3A4;--warn:#DB7F8E;--bad:#D5C5C8;--h0:#49383D;--h1:#604D53;--h2:#806D72;--h3:#DB7F8E;--h4:#9DA3A4}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#FFDBDA} body{background:#FFDBDA;color:#604D53;font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;line-height:1.55;padding-bottom:84px}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:18px 0 8px}
.pts{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.hero{display:flex;gap:12px;align-items:center;background:#FFF7F6;border-color:#DB7F8E}
.hero .mascot{flex:none;width:128px;height:96px;object-fit:contain;transition:transform .3s}
.hero .mascot.bounce{animation:b .6s}
@keyframes b{40%{transform:translateY(-14px) rotate(-5deg)}}
.hero p{margin:0}.hero .big{font-weight:700;font-size:17px}
.row{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.sub{color:#604D53;font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border:0}.item .grow{flex:1;min-width:0}
.tag{font-size:12px;padding:1px 9px;border-radius:99px;background:#FFF7F6;color:#604D53;border:1px solid #DB7F8E;white-space:nowrap}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--pri);background:none;cursor:pointer;flex:none;color:#fff;font-size:15px}
.done .chk{background:#604D53;border-color:#604D53;color:#FFFFFF}.done .t{text-decoration:line-through;opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;border-radius:14px;padding:6px 10px;font:inherit;font-size:12px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:21px}nav button.on{background:#FFF7F6;color:#604D53;font-weight:700;border:1px solid #DB7F8E}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #604D53;outline-offset:2px}
h1,h2,.hero .big,.pts,.form label,.cal .l,.grid .hd{color:#604D53}
input,select{color:#604D53}
.tag{color:#604D53}
.btn{background:#604D53;color:#FFFFFF;border:1px solid #604D53}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:14px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:#FFF7F6;color:#604D53;border:1.5px solid #604D53}
.btn.ghost[data-do]{background:#604D53;color:#FFFFFF;border:1.5px solid #604D53}
.btn.ghost[data-do]:hover{background:#49383D;color:#FFFFFF}
.btn.danger{background:#604D53;color:#fff;border-color:#604D53}
.btn:active{transform:translateY(1px)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .full{grid-column:1/-1}
.tt{overflow-x:auto}.grid{display:grid;grid-template-columns:34px repeat(5,minmax(78px,1fr));min-width:440px}
.grid .hd{text-align:center;font-weight:700;padding:4px 0}.grid .hd.today{color:var(--pri)}
.col{position:relative;height:480px;border-left:1px dashed var(--line)}
.hr{height:48px;font-size:11px;color:var(--sub);text-align:right;padding-right:4px}
.blk{position:absolute;left:2px;right:2px;border-radius:10px;padding:3px 5px;font-size:11px;line-height:1.3;color:#604D53;overflow:hidden}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat div{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.heat .l{aspect-ratio:auto;background:none;color:var(--sub);font-weight:700}
.timer{font-size:56px;font-weight:700;text-align:center;letter-spacing:2px;margin:6px 0}
.conf{position:fixed;pointer-events:none;font-size:22px;z-index:20;animation:f 1.1s ease-out forwards}
@keyframes f{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.conf,.hero .mascot.bounce{animation:none}}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.form input,.form select{width:100%;font-size:15px}
.due{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.due input[type=number]{width:76px;text-align:center}
.due input[type=date]{flex:1;min-width:150px;width:auto}
.tk{border-bottom:1px dashed var(--line)}.tk:last-child{border:0}.tk .item{border:0}
.more{background:none;border:0;font-size:22px;line-height:1;color:var(--sub);cursor:pointer;padding:4px 8px;border-radius:10px}
.menu{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 10px 36px}
.btn.sm{padding:5px 12px;font-size:13px}
.calnav{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.calnav select{flex:1;min-width:0;padding:6px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .l{text-align:center;color:var(--sub);font-weight:700;font-size:13px}
.cd{aspect-ratio:1/1.1;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;padding:4px 2px 5px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.cd b{font-size:14px}.cd.tdy{border-color:var(--pri)}.cd.sel{outline:3px solid var(--pri);outline-offset:1px}
.dots{display:flex;gap:2px;margin-top:auto;align-items:center}.dots i{width:6px;height:6px;border-radius:50%}.dots small{font-size:10px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#604D53;color:#FFFFFF;padding:8px 16px;border-radius:99px;z-index:30;font-size:14px;white-space:nowrap}
.hide{display:none}

/* Soft Blush Light Mode: force bright, readable surfaces across every tab */
:root, :root[data-theme="dark"]{color-scheme:light;--bg:#FFDBDA;--surface:#FFF7F6;--card:#FFFFFF;--ink:#604D53;--sub:#604D53;--line:#DB7F8E;--pri:#DB7F8E;--pri2:#FFF0F0;--ok:#718A78;--warn:#DB7F8E;--bad:#604D53;--h0:#FFF7F6;--h1:#E8F2E9;--h2:#FFF0D8;--h3:#F8D7DF;--h4:#F2C5CB}
html,body{background:#FFDBDA!important;color:#604D53!important}
.card{background:#FFFFFF!important;color:#604D53!important}
.hero{background:#FFF7F6!important}
.sub,.hr,.form label,.cal .l,.heat .l{color:#604D53!important;opacity:1!important}
.item,.tk,.menu{color:#604D53!important}
input,select,textarea{background:#FFF7F6!important;color:#604D53!important;border-color:#DB7F8E!important}
option{background:#FFFFFF!important;color:#604D53!important}
.tag{background:#FFF7F6!important;color:#604D53!important}
.btn{background:#DB7F8E!important;color:#FFFFFF!important;border-color:#DB7F8E!important}
.btn.ghost,.btn.ghost[data-do]{background:#FFF7F6!important;color:#604D53!important;border-color:#DB7F8E!important}
.btn.ghost[data-do]:hover{background:#FFE8E8!important;color:#604D53!important}
.btn.danger{background:#DB7F8E!important;color:#FFFFFF!important;border-color:#DB7F8E!important}
.done .chk{background:#DB7F8E!important;border-color:#DB7F8E!important;color:#FFFFFF!important}
nav{background:#FFFFFF!important}
nav button{color:#604D53!important}
nav button.on{background:#FFF0F0!important;color:#604D53!important;border-color:#DB7F8E!important}
.pts{background:#FFFFFF!important;color:#604D53!important}
.blk{color:#604D53!important}
.cd{color:#604D53!important}
.toast{background:#604D53!important;color:#FFFFFF!important}


/* Calendar: soft pastel cells with readable dark dates */
:root, :root[data-theme="dark"]{--h0:#FFFFFF;--h1:#E5F3E8;--h2:#FFF2D6;--h3:#FFE2D2;--h4:#F8D5DE}
.cal .cd{background:#FFFFFF!important;color:#604D53!important}
.cal .cd[style*="--h1"]{background:#E5F3E8!important}
.cal .cd[style*="--h2"]{background:#FFF2D6!important}
.cal .cd[style*="--h3"]{background:#FFE2D2!important}
.cal .cd[style*="--h4"]{background:#F8D5DE!important}
.cal .cd b{color:#604D53!important;font-weight:700}
.cal .cd .dots small{color:#604D53!important}
.cal .cd.tdy{border-color:#DB7F8E!important}
.cal .cd.sel{outline-color:#DB7F8E!important}
/* Task urgency badges */
.tag.urgency{font-weight:700;border-width:1.5px}
.tag.urgency.urgent{background:#F9D2D8!important;color:#A83248!important;border-color:#D85C72!important}
.tag.urgency.soon{background:#FFE8C7!important;color:#965A12!important;border-color:#E9A64D!important}
.tag.urgency.relaxed{background:#DCEFE1!important;color:#326B45!important;border-color:#82B993!important}


/* PWA / notification controls */
.notify-card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;color:#604D53}
.notify-card p{margin:5px 0}
.notify-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.notify-status{font-size:13px;color:#604D53;background:#FFF0F0;border:1px solid #DB7F8E;border-radius:12px;padding:8px 10px;margin-top:8px}
.notify-card .btn{background:#DB7F8E;color:#fff;border-color:#DB7F8E}
.notify-card .btn.ghost{background:#FFF7F6;color:#604D53;border-color:#DB7F8E}
@media(max-width:420px){.notify-actions .btn{flex:1;min-width:130px}}
</style>

function render(){sync();
document.getElementById('pts').textContent='⭐ '+pts;
const nav=[['home','🏠','หน้าแรก'],['sched','📅','ตารางเรียน'],['tasks','📝','งาน'],['heat','🗓️','ปฏิทิน'],['focus','⏱️','โฟกัส']];
document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${tab===n[0]?'on':''}" data-t="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
const v={home,sched:schedV,tasks:tasksV,heat:heatV,focus:focusV}[tab]();
document.getElementById('app').innerHTML=v}
function home(){
const todo=tasks.filter(x=>!x.done).sort((a,b)=>score(b)-score(a));
const n=todo.length,m=n===0?'happy':n>4?'worry':'ok';
const msg=n===0?'เก่งมาก! งานเสร็จหมดแล้ว พักผ่อนได้เลย 🎉':n>4?`งานเยอะนิดนึงนะ แต่ไปทีละอัน เดี๋ยวมุยมุยช่วยเรียงให้!`:`เหลืออีกแค่ ${n} งานก็เสร็จแล้วนะ สู้ ๆ 💪`;
const dow=today.getDay();const cl=sched.filter(s=>s[1]===dow).sort((a,b)=>a[2]-b[2]);
return `<div class="card hero">${mascot(m)}<div><p class="big">สวัสดี! วัน${['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'][dow]}นี้</p><p>${msg}</p></div></div>
<div class="notify-card"><strong>🔔 แจ้งเตือนมุยมุย</strong><p>เปิดแจ้งเตือนบนอุปกรณ์นี้ และติดตั้งเว็บเป็นแอปได้</p><div id="notifyStatus" class="notify-status">กำลังตรวจสอบสถานะ…</div><div class="notify-actions"><button class="btn" data-push="enable">เปิดแจ้งเตือน</button><button class="btn ghost" data-push="test">ทดสอบแจ้งเตือน</button><button class="btn ghost" data-push="install">ติดตั้งมุยมุย</button></div><p class="sub" style="margin-top:8px">หมายเหตุ: การแจ้งเตือนตามกำหนดเวลาจริง แม้ปิดเว็บ ต้องตั้งค่าเซิร์ฟเวอร์ Push เพิ่มเติม</p></div>
<h2>🎯 วันนี้ควรทำอะไรก่อน</h2><div class="card">${todo.slice(0,3).map((t,i)=>`<div class="item"><div style="font-size:22px">${['🥇','🥈','🥉'][i]}</div><div class="grow"><div>${esc(t.t)}</div><div class="sub">${courses[t.c]} · ส่ง${dueTxt(t.d)}</div></div><button class="btn ghost" data-do="${t.id}">เสร็จแล้ว</button></div>`).join('')||'<p class="sub">ไม่มีงานค้างเลย 🌈</p>'}
<p class="sub" style="margin:8px 0 0">เรียงจากความใกล้ deadline + น้ำหนักคะแนน + ความยาก</p></div>
<h2>📚 เรียนวันนี้</h2><div class="card">${cl.length?cl.map(s=>`<div class="item"><span class="dot" style="background:${C[s[0]]};outline:2px solid var(--line)"></span><div class="grow">${courses[s[0]]}<div class="sub">${s[4]}</div></div><span class="tag">${s[2]}:00–${s[3]}:00</span></div>`).join(''):'<p class="sub">วันนี้ไม่มีเรียน ใช้เวลานี้ลุยงานได้เลย ✨</p>'}</div>`}
function schedV(){
const dow=today.getDay();
let h='<h2>📅 ตารางเรียนประจำสัปดาห์</h2><div class="card tt"><div class="grid"><div></div>'+[1,2,3,4,5].map(d=>`<div class="hd ${d===dow?'today':''}">${DAYS[d]}</div>`).join('');
h+='<div>'+Array.from({length:10},(_,i)=>`<div class="hr">${8+i}</div>`).join('')+'</div>';
for(let d=1;d<=5;d++)h+=`<div class="col">${sched.filter(s=>s[1]===d).map(s=>`<div class="blk" style="top:${(s[2]-8)*48}px;height:${(s[3]-s[2])*48-4}px;background:${C[s[0]]}"><b>${courses[s[0]]}</b><br>${s[4]}</div>`).join('')}</div>`;
h+='</div></div>';
const free=[];for(let d=1;d<=5;d++){let last=8;sched.filter(s=>s[1]===d).sort((a,b)=>a[2]-b[2]).forEach(s=>{if(s[2]-last>=2)free.push([d,last,s[2]]);last=s[3]});if(17-last>=2)free.push([d,last,17])}
return h+`<h2>🕐 ช่วงว่างที่เหมาะอ่านหนังสือ</h2><div class="card">${free.slice(0,5).map(f=>`<div class="item"><span class="tag">วัน${DAYS[f[0]]}</span><div class="grow">${f[1]}:00–${f[2]}:00</div><span class="sub">${f[2]-f[1]} ชม.</span></div>`).join('')}</div>`}
function taskRow(t){const dt=parse(t.due);
return `<div class="tk"><div class="item ${t.done?'done':''}"><button class="chk" data-do="${t.id}" aria-label="ทำเสร็จ">${t.done?'✓':''}</button><div class="grow"><div class="t">${esc(t.t)}</div><div class="sub"><span class="dot" style="display:inline-block;background:${C[t.c]};outline:2px solid var(--line)"></span> ${courses[t.c]} · ${t.done?'เสร็จแล้ว':dueTxt(t.d)} (${dt.getDate()} ${MS[dt.getMonth()]})</div></div>${t.done?'':`<span class="tag urgency ${t.d<=1?'urgent':t.d<=3?'soon':'relaxed'}">${t.d<=1?'ด่วน':t.d<=3?'ใกล้ส่ง':'สบาย ๆ'}</span>`}<button class="more" data-m="${t.id}" aria-label="เมนูงาน">⋯</button></div>${menuId===t.id?(confirmId===t.id?`<div class="menu"><span class="sub">ลบงานนี้จริงไหม?</span><button class="btn sm danger" data-yes="${t.id}">ลบเลย</button><button class="btn sm ghost" data-no="1">ยกเลิก</button></div>`:`<div class="menu"><button class="btn sm ghost" data-ed="${t.id}">✏️ แก้ไข</button><button class="btn sm ghost" data-del="${t.id}">🗑️ ลบ</button></div>`):''}</div>`}
function tasksV(){
const opt=(o,v)=>Object.entries(o).map(([k,x])=>`<option value="${k}" ${k==v?'selected':''}>${x}</option>`).join('');
const list=[...tasks].sort((a,b)=>a.done-b.done||score(b)-score(a));
return `<h2>${editId?'✏️ แก้ไขงาน':'➕ เพิ่มงานใหม่'}</h2><div class="card"><div class="form">
<label class="full">ชื่องาน<input id="nt" value="${esc(draft.t)}" placeholder="เช่น ทำรายงานกลุ่ม" maxlength="60"></label>
<label class="full">วิชา<select id="nc">${opt(courses,draft.c)}</select></label>
<label>น้ำหนักคะแนน<select id="nw">${opt({1:'น้อย',3:'กลาง',5:'เยอะ'},draft.w)}</select></label>
<label>ความยาก<select id="nh">${opt({1:'ง่าย',2:'ปานกลาง',3:'ยาก'},draft.h)}</select></label>
<div class="full due"><span>ส่งอีก</span><input id="nn" type="number" min="0" value="${diff(draft.due)}" aria-label="จำนวนวันที่เหลือ"><span>วัน</span><span class="sub">หรือเลือกวันที่</span><input id="nd" type="date" value="${draft.due}" aria-label="วันที่ส่ง"></div>
<div class="full sub" id="dh">→ ${fmt(draft.due)}</div>
<button class="btn full" data-add="1">${editId?'บันทึกการแก้ไข':'เพิ่มงาน'}</button>${editId?'<button class="btn ghost full" data-cx="1">ยกเลิกการแก้ไข</button>':''}</div></div>
<h2>📝 งานทั้งหมด (${tasks.length})</h2><div class="card">${list.map(taskRow).join('')||'<p class="sub">ยังไม่มีงาน เพิ่มงานแรกด้านบนได้เลย ✨</p>'}</div>`}
function loadIso(s){let x=0;tasks.forEach(t=>{if(!t.done&&t.due===s)x+=t.h*1.5+t.w*.5});return x}
function heatV(){
const dim=new Date(calY,calM+1,0).getDate(),lead=new Date(calY,calM,1).getDay(),ty=today.getFullYear(),todayS=iso(today);
const yrs=[];for(let y=Math.min(ty-4,calY);y<=Math.max(ty+10,calY);y++)yrs.push(y);
let h=`<h2>🗓️ ปฏิทินงาน</h2><div class="card"><div class="calnav"><button class="btn ghost sm" data-cm="-1" aria-label="เดือนก่อนหน้า">‹</button><select id="cm" aria-label="เดือน">${MF.map((m,i)=>`<option value="${i}" ${i===calM?'selected':''}>${m}</option>`).join('')}</select><select id="cy" aria-label="ปี พ.ศ.">${yrs.map(y=>`<option value="${y}" ${y===calY?'selected':''}>${y+543}</option>`).join('')}</select><button class="btn ghost sm" data-cm="1" aria-label="เดือนถัดไป">›</button><button class="btn sm" data-cm="today">วันนี้</button></div><div class="cal">`+DAYS.map(d=>`<div class="l">${d}</div>`).join('');
for(let i=0;i<lead;i++)h+='<div></div>';
let n=0,mx=0,mxd=0;
for(let d=1;d<=dim;d++){const q=iso(new Date(calY,calM,d)),l=loadIso(q),k=l<=0?0:l<3?1:l<5?2:l<8?3:4,ts=tasks.filter(t=>t.due===q&&!t.done);
n+=ts.length;if(l>mx){mx=l;mxd=d}
h+=`<button class="cd ${q===todayS?'tdy':''} ${q===selDay?'sel':''}" style="background:var(--h${k})" data-day="${q}" aria-label="${d} ${MF[calM]}${ts.length?' มี '+ts.length+' งาน':''}"><b>${d}</b><span class="dots">${ts.slice(0,3).map(t=>`<i style="background:${DC[t.c]}"></i>`).join('')}${ts.length>3?'<small>+</small>':''}</span></button>`}
h+=`</div><p class="sub" style="margin:10px 0 0">สีพื้น: เขียว = สบาย · เหลือง = เริ่มหนัก · แดง = งานท่วม · จุดสี = วิชาที่มีงานส่ง</p></div>`;
h+=`<div class="card hero">${mascot(n===0?'happy':mx>=8?'worry':'ok')}<p>${n?`เดือน${MF[calM]}มีงานต้องส่ง ${n} งาน หนักสุดคือวันที่ ${mxd}`:`เดือน${MF[calM]}ยังไม่มีงานค้าง ✨`}</p></div>`;
const dow=parse(selDay).getDay(),dayT=tasks.filter(t=>t.due===selDay).sort((a,b)=>a.done-b.done||score(b)-score(a)),cl=sched.filter(x=>x[1]===dow).sort((a,b)=>a[2]-b[2]);
h+=`<h2>${fmt(selDay)}${selDay===todayS?' (วันนี้)':''}</h2><div class="card"><div class="sub">📝 งานที่ต้องส่ง</div>${dayT.length?dayT.map(taskRow).join(''):'<p class="sub" style="margin:6px 0">ไม่มีงานส่งวันนี้ ว่างจัง 🌈</p>'}<button class="btn ghost" style="margin-top:8px" data-new="${selDay}">➕ เพิ่มงานวันนี้</button></div>
<div class="card"><div class="sub">📚 วิชาเรียนประจำวัน${WD[dow]}</div>${cl.length?cl.map(x=>`<div class="item"><span class="dot" style="background:${C[x[0]]};outline:2px solid var(--line)"></span><div class="grow">${courses[x[0]]}<div class="sub">${x[4]}</div></div><span class="tag">${x[2]}:00–${x[3]}:00</span></div>`).join(''):'<p class="sub" style="margin:6px 0">ไม่มีเรียน</p>'}</div>`;
return h}
function focusV(){
const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');
return `<h2>⏱️ Pomodoro 25 นาที</h2><div class="card"><select id="pc" style="width:100%">${Object.entries(courses).map(([k,v])=>`<option value="${k}" ${k===pc?'selected':''}>${v}</option>`).join('')}</select><div class="timer" id="tm">${m}:${s}</div><div class="row" style="justify-content:center"><button class="btn" data-f="go">${run?'พัก':'เริ่มโฟกัส'}</button><button class="btn ghost" data-f="rs">รีเซ็ต</button></div><p class="sub" style="text-align:center">โฟกัสสำเร็จแล้ว ${sessions} รอบ · ได้ ⭐ รอบละ 5</p></div>`}
function confetti(e){const r=e.target.getBoundingClientRect();['🎉','✨','⭐','💖','🌸'].concat(['🎊','✨','⭐']).forEach(c=>{const p=document.createElement('div');p.className='conf';p.textContent=c;p.style.left=r.left+r.width/2+'px';p.style.top=r.top+'px';p.style.setProperty('--x',(Math.random()*160-80)+'px');p.style.setProperty('--y',(Math.random()*-120-20)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),1200)})}
function tick(){sec--;if(sec<=0){clearInterval(run);run=null;sec=25*60;sessions++;pts+=5;toast('จบรอบโฟกัสแล้ว! พักสักครู่นะ ☕')}if(tab==='focus')render();else document.getElementById('pts').textContent='⭐ '+pts}
function hint(){const h=document.getElementById('dh');if(h)h.textContent='→ '+fmt(draft.due)}
document.addEventListener('click',e=>{
const b=e.target.closest('[data-t],[data-do],[data-add],[data-f],[data-m],[data-ed],[data-del],[data-yes],[data-no],[data-cx],[data-cm],[data-day],[data-new]');if(!b)return;
const D=b.dataset;
if(D.t){tab=D.t;menuId=confirmId=null;render();return}
if(D.do){const t=tasks.find(x=>x.id==D.do);t.done=!t.done;if(t.done){pts+=10;confetti(e)}else pts=Math.max(0,pts-10);render();const m=document.getElementById('mas');if(m)m.classList.add('bounce');return}
if(D.m){menuId=menuId===+D.m?null:+D.m;confirmId=null;render();return}
if(D.ed){const t=tasks.find(x=>x.id==D.ed);editId=t.id;draft={t:t.t,c:t.c,due:t.due,w:t.w,h:t.h};menuId=null;tab='tasks';render();scrollTo(0,0);return}
if(D.del){confirmId=+D.del;render();return}
if(D.yes){tasks=tasks.filter(x=>x.id!=D.yes);menuId=confirmId=null;if(editId==D.yes){editId=null;resetDraft()}toast('ลบงานแล้ว 🗑️');render();return}
if(D.no){confirmId=menuId=null;render();return}
if(D.cx){editId=null;resetDraft();render();return}
if(D.cm){if(D.cm==='today'){calY=today.getFullYear();calM=today.getMonth();selDay=iso(today)}else{calM+=+D.cm;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}}render();return}
if(D.day){selDay=D.day;menuId=confirmId=null;render();return}
if(D.new){resetDraft();draft.due=D.new;editId=null;tab='tasks';menuId=null;render();scrollTo(0,0);return}
if(D.add){const t=draft.t.trim();if(!t){document.getElementById('nt').focus();return}
if(editId){Object.assign(tasks.find(k=>k.id===editId),{t,c:draft.c,due:draft.due,w:+draft.w,h:+draft.h});editId=null;toast('บันทึกการแก้ไขแล้ว ✏️')}
else{tasks.push({id:nid++,t,c:draft.c,due:draft.due,w:+draft.w,h:+draft.h,done:false});toast('เพิ่มงานแล้ว ✨')}
resetDraft();render();return}
if(D.f==='go'){if(run){clearInterval(run);run=null}else run=setInterval(tick,1000);render()}
if(D.f==='rs'){clearInterval(run);run=null;sec=25*60;render()}});
document.addEventListener('input',e=>{const i=e.target.id,v=e.target.value;
if(i==='nt')draft.t=v;else if(i==='nc')draft.c=v;else if(i==='nw')draft.w=+v;else if(i==='nh')draft.h=+v;
else if(i==='nn'){draft.due=iso(addD(parseInt(v)||0));document.getElementById('nd').value=draft.due;hint()}
else if(i==='nd'&&v){draft.due=v;document.getElementById('nn').value=diff(v);hint()}});
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;
if(i==='pc')pc=v;if(i==='cm'){calM=+v;render()}if(i==='cy'){calY=+v;render()}});

// ---- Progressive Web App & notification starter ----
let muimuiInstallPrompt = null;
const VAPID_PUBLIC_KEY = ""; // เติม VAPID public key เมื่อเชื่อม backend push จริง
const PUSH_SUBSCRIBE_ENDPOINT = "/api/push/subscribe"; // endpoint ฝั่ง server ที่ต้อง deploy เพิ่ม
window.addEventListener("beforeinstallprompt", (ev) => { ev.preventDefault(); muimuiInstallPrompt = ev; });
function updateNotifyStatus(){
  const el=document.getElementById("notifyStatus"); if(!el)return;
  if(!("Notification" in window)) el.textContent="อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับ Notifications";
  else if(Notification.permission==="granted") el.textContent="อนุญาตแจ้งเตือนแล้ว ✓ (ทดสอบแจ้งเตือนได้)";
  else if(Notification.permission==="denied") el.textContent="ปิดสิทธิ์แจ้งเตือนแล้ว — เปิดได้จากการตั้งค่าเว็บไซต์ในเบราว์เซอร์";
  else el.textContent="ยังไม่ได้อนุญาตแจ้งเตือน";
}
async function registerMuimuiSW(){
  if(!("serviceWorker" in navigator)) return;
  try { await navigator.serviceWorker.register("./sw.js"); } catch(err){ console.warn("SW register failed",err); }
}
async function enableMuimuiNotifications(){
  if(!("Notification" in window)){toast("เบราว์เซอร์นี้ไม่รองรับแจ้งเตือน");return}
  const permission=await Notification.requestPermission(); updateNotifyStatus();
  if(permission!=="granted"){toast("ยังไม่ได้อนุญาตแจ้งเตือน");return}
  await registerMuimuiSW();
  if(VAPID_PUBLIC_KEY && PUSH_SUBSCRIBE_ENDPOINT && "serviceWorker" in navigator){
    try{
      const reg=await navigator.serviceWorker.ready;
      const subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
      await fetch(PUSH_SUBSCRIBE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(subscription)});
      toast("เชื่อมระบบ Push แล้ว 💗");
    }catch(err){console.error(err);toast("สมัคร Push ไม่สำเร็จ ตรวจสอบ backend")}
  } else toast("เปิดสิทธิ์แจ้งเตือนแล้ว — พร้อมทดสอบบนอุปกรณ์นี้");
}
function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=window.atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function testMuimuiNotification(){
  if(!("Notification" in window)){toast("อุปกรณ์นี้ไม่รองรับ Notifications");return}
  if(Notification.permission!=="granted"){await enableMuimuiNotifications();if(Notification.permission!=="granted")return}
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification("💗 มุยมุยแจ้งเตือน",{body:"ทดสอบสำเร็จ! เมื่อเชื่อมระบบ Push หลังบ้านแล้ว จะส่งแจ้งเตือนได้แม้ไม่ได้เปิดเว็บ",icon:"./muimui-icon.svg",badge:"./muimui-icon.svg",tag:"muimui-test",renotify:false});
  }catch(e){new Notification("💗 มุยมุยแจ้งเตือน",{body:"ทดสอบแจ้งเตือนสำเร็จ"});}
}
async function installMuimui(){
  if(muimuiInstallPrompt){muimuiInstallPrompt.prompt();await muimuiInstallPrompt.userChoice;muimuiInstallPrompt=null;}
  else toast("ถ้าไม่ขึ้นติดตั้ง ให้เปิดเมนูเบราว์เซอร์แล้วเลือก Add to Home Screen / Install");
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-push]");if(!b)return;
  if(b.dataset.push==="enable")await enableMuimuiNotifications();
  if(b.dataset.push==="test")await testMuimuiNotification();
  if(b.dataset.push==="install")await installMuimui();
  updateNotifyStatus();
});
window.addEventListener("focus",updateNotifyStatus);
registerMuimuiSW();

render();
</script>
